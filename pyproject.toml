[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "taskgraph"
version = "0.1.0"
description = "Audit and visualize dependency graphs for Makefile, npm, and justfile task targets."
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
taskgraph = "taskgraph.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
